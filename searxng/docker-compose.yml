version: '3.8'

services:
  searxng-api:
    image: searxng/searxng:latest
    ports:
      - "8084:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng-data:/data:rw
    environment:
      - SEARXNG_SETTINGS_FILE=/etc/searxng/settings.yml
    restart: unless-stopped
